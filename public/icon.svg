<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pagemap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6380f5" />
      <stop offset="100%" stop-color="#465ef0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#465ef0" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#pagemap-grad)" filter="url(#shadow)" />
  
  <!-- Inner Map / Structure elements -->
  <!-- Header bar -->
  <rect x="28" y="28" width="72" height="14" rx="4" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- Section 1 -->
  <rect x="28" y="48" width="46" height="10" rx="3" fill="#ffffff" fill-opacity="0.8" />
  <rect x="80" y="48" width="20" height="10" rx="3" fill="#b4c7fc" />
  
  <!-- Section 2 -->
  <rect x="28" y="64" width="72" height="10" rx="3" fill="#ffffff" fill-opacity="0.8" />
  
  <!-- Section 3 & 4 Cards -->
  <rect x="28" y="80" width="33" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" />
  <rect x="67" y="80" width="33" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" />
  
  <!-- Compass indicator needle / dot -->
  <circle cx="94" cy="35" r="3" fill="#465ef0" />
</svg>